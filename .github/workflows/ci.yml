name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:copy
      - run: npm run build

  database:
    # Applies every migration to a clean Postgres and runs the database tests, including the
    # structural checks that every table has row level security, audit and no hard delete.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Console migrations (Supabase project)
        run: CI_PG=1 bash scripts/db/test-migrations.sh scripts/db/test_0002a.sql scripts/db/test_0003.sql scripts/db/test_0004.sql scripts/db/test_0005.sql scripts/db/test_hardening.sql scripts/db/test_0006_0007.sql scripts/db/test_0008.sql scripts/db/test_0009_0010.sql
      - name: Hetzner migrations (Xpert database)
        run: CI_PG=1 bash scripts/db/test-hetzner.sh hetzner/tests/test_hetzner.sql
      - name: Postgres Xpert store against the hetzner schema
        run: CI_PG=1 bash scripts/db/test-hetzner-store.sh
      - name: Import from the previous backend
        run: CI_PG=1 bash scripts/db/test-import.sh
